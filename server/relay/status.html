<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PvZ 中继服务状态</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10201a;color:#e6eee8;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:36px auto;padding:0 24px}h1{font-size:28px;margin:0}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.muted{color:#a9bcaf}#badge{border:1px solid #61846b;border-radius:24px;padding:5px 16px;color:#b6ecc1;white-space:nowrap;flex-shrink:0}header>div{min-width:0}#meta{overflow-wrap:anywhere}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:24px 0}.card{background:#1b3026;border:1px solid #365341;border-radius:14px;padding:18px}.value{font-size:28px;font-weight:650;margin:4px 0}.label{color:#b9cbbd}.warning{background:#40301d;border:1px solid #896e43;padding:12px 18px;border-radius:10px;white-space:pre-line}p{margin:8px 0}footer{margin-top:24px;font-size:14px}a{color:#b6ecc1}@media(max-width:500px){header{align-items:flex-start;gap:12px}h1{font-size:23px}#badge{padding:4px 10px;font-size:14px}}
</style>
<main><header><div><h1>PvZ 中继服务状态</h1><div class="muted" id="meta">正在读取服务器状态…</div></div><span id="badge">读取中</span></header>
<div id="cards"></div><div id="warnings" class="warning" hidden></div>
<section class="card"><h2>最近10分钟发送趋势</h2><canvas id="trend" width="1000" height="180" style="width:100%;height:180px" aria-label="发送 Mbps 趋势"></canvas><p class="muted" id="trend-note">正在加载历史…</p></section><footer class="muted"><p>每 5 秒刷新，统计约每秒采样。CPU 100% 表示占满一核；内存为当前进程实际驻留值。</p><p>流量含中继数据帧，未计 IP/TCP 头和重传。房间与连接上限是保护阈值，不代表实战容量。累计值重启清零。</p><p>此页面只监听服务器本机，不提供修改或踢人操作。<a href="/status">查看 JSON</a></p></footer></main>
<script>
const $=id=>document.getElementById(id),num=(n,d=0)=>Number(n).toFixed(d),mib=n=>n==null?'暂不可用':num(n/1048576,1)+' MiB';
function card(label,value,note){const e=document.createElement('section');e.className='card';for(const [cls,text] of [['label',label],['value',value],['muted',note]]){const p=document.createElement('div');p.className=cls;p.textContent=text;e.append(p)}return e}
async function refresh(){try{const res=await fetch('/status',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const s=await res.json();$('badge').textContent='运行中';$('meta').textContent=s.release+' · TCP '+s.game_port+' · 已运行 '+num(s.uptime_seconds/3600,1)+' 小时 · '+new Date(s.sampled_at).toLocaleTimeString();
const o=s.operations||{},states={normal:'正常',busy:'繁忙',full:'已达上限',maintenance:'暂停新建房'},reasons={rooms:'房间占用',connections:'连接占用',send_budget:'发送预算',cpu:'CPU',send_queue:'发送队列',host_memory:'可用内存不足',recent_queue_drops:'近期队列满',recent_write_errors:'近期写入失败',recent_timeouts:'近期连接超时'};
const cards=[['在线玩家',s.players+' 人',s.connections+'/'+s.connection_limit+' 个连接，房外 '+s.anonymous_connections],['房间',s.rooms+' / '+s.room_limit,'公开待开局 '+s.public_waiting_rooms+' · 已开局 '+s.started_rooms],['进程 CPU',s.cpu_percent_one_core==null?'采样中':num(s.cpu_percent_one_core,1)+'%','100%=一核；程序可用 '+s.go_max_procs+' 核'],['驻留内存',mib(s.process.rss_bytes),'Go 堆 '+mib(s.heap_bytes)],['整机可用内存',mib(s.process.host_memory_available_bytes),'总内存 '+mib(s.process.host_memory_total_bytes)],['发送带宽',num(s.sent_bytes_per_second*8/1e6,3)+' Mbps',num(s.sent_bytes_per_second/1024,1)+' KiB/s'],['接收带宽',num(s.received_bytes_per_second*8/1e6,3)+' Mbps',num(s.received_bytes_per_second/1024,1)+' KiB/s'],['事件转发',num(s.forwarded_frames_per_second)+' 帧/s','累计 '+s.forwarded_frames_total+' 帧'],['大厅查询',num(s.directory_queries_per_second,1)+' 次/s','累计 '+s.directory_queries_total+' 次'],['等待发送',s.queued_frames+' 帧','单连接最高 '+s.max_connection_queue+'/64'],['掉线保留',s.held_seats+' 席','超时断开累计 '+s.timed_out_total],['累计流量',mib(s.sent_bytes_total),'发送；接收 '+mib(s.received_bytes_total)]];cards.push(['接收新房',o.accept_new_rooms?'允许尝试':'暂不接收',o.state==='busy'?'当前繁忙，仍尝试分配':(states[o.state]||'正常')],['发送预算',o.send_budget_mbps?num(o.send_budget_mbps,2)+' Mbps':'未配置','公网套餐 '+(o.bandwidth_mbps?num(o.bandwidth_mbps,2)+' Mbps':'未配置')+'；应用统计非精确出口'],['近一分钟异常',(o.queue_drops_last_minute||0)+' 次队列满','写失败 '+(o.write_errors_last_minute||0)+' · 超时 '+(o.timeouts_last_minute||0)],['配置与节点','修订 '+(o.config_revision||0),'目录 '+(o.catalog_revision||0)+' · '+(o.catalog_nodes||0)+' 个节点']);$('cards').replaceChildren(...cards.map(c=>card(...c)));
const warnings=[];if(o.catalog_expired)warnings.push('服务器清单已过期，请发布新修订；现有对局继续运行。');if(o.config_error)warnings.push('配置更新未生效，保留原配置：'+o.config_error);if(o.busy)warnings.push('当前负载偏高，仍可尝试创建房间。原因：'+(o.reasons||[]).map(x=>reasons[x]||x).join('、'));if(s.queue_drops_total)warnings.push('累计 '+s.queue_drops_total+' 次发送队列满断开，请结合是否持续增长排查。');if(s.capacity_rejected_total)warnings.push('累计 '+s.capacity_rejected_total+' 次连接数达到上限。');if(s.cpu_percent_one_core>80*s.go_max_procs)warnings.push('当前进程 CPU 较高。');if(s.process.host_memory_available_bytes!=null&&s.process.host_memory_available_bytes<100*1048576)warnings.push('整机可用内存不足 100 MiB。');$('warnings').hidden=!warnings.length;$('warnings').textContent=warnings.join('\n');await history();}
catch(e){$('badge').textContent='查询失败';$('meta').textContent='无法读取本机状态：'+e.message}}
async function history(){try{const r=await fetch('/history',{cache:'no-store'});if(!r.ok)throw Error('历史查询失败');const points=await r.json();const c=$('trend'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);if(!points.length){$('trend-note').textContent='采样中';return}const max=Math.max(0.1,...points.map(p=>p.sent_mbps));g.strokeStyle='#b6ecc1';g.lineWidth=2;g.beginPath();points.forEach((p,i)=>{const x=20+(c.width-40)*i/Math.max(1,points.length-1),y=c.height-24-(c.height-42)*p.sent_mbps/max;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle='#b9cbbd';g.fillText(max.toFixed(2)+' Mbps',20,14);$('trend-note').textContent=points.length+' 个样本 · 每5秒记录 · 最后 '+new Date(points.at(-1).at).toLocaleTimeString()}catch(e){$('trend-note').textContent='历史暂不可用：'+e.message}}
refresh();setInterval(refresh,5000);
</script></html>
